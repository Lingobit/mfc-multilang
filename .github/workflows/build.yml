name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x86, x64]
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild MultiLang.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: matrix.configuration == 'Release'
        with:
          name: MultiLang-${{ matrix.platform }}
          path: |
            Output/${{ matrix.platform == 'x86' && 'Win32' || 'x64' }}/Release/*.dll
            Output/${{ matrix.platform == 'x86' && 'Win32' || 'x64' }}/Release/*.lib
            Output/${{ matrix.platform == 'x86' && 'Win32' || 'x64' }}/Release/*.exe
